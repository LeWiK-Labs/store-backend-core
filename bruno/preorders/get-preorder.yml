info:
  name: Get Preorder
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/variants/{{variantId}}/preorder"
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
settings:
  encodeUrl: true
docs: |-
  # Get Preorder
  Devuelve el drop de una variante (cupo, vendido, disponible, release, abono).

  Desde 4.7 el cupo también se empuja en vivo: `Preorder` pasó a agregado y levanta
  `PreorderCapacityChanged` cada vez que se reserva, se libera, se reconfigura o se
  cierra. Esta llamada sigue siendo la lectura puntual; el contador de la página de
  un drop se alimenta del hub (ver la carpeta **Storefront**). Cerrarlo también se emite:
  la variante pasa a venderse del stock y el contador cambia de unidad de medida solo,
  sin que nadie recargue.

  Un drop cerrado se sigue leyendo acá con su `soldCount` y su `capacity` históricos —
  es el registro del drop, no lo que se está vendiendo hoy. Para eso está `/storefront`.

  ## Respuestas
  - **200** — el preorder
  - **404** `preorder.not_found` — la variante no tiene preorder configurado
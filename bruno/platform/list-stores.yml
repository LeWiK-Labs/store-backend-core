info:
  name: List Stores
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/platform/stores"
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
settings:
  encodeUrl: true
docs: |-
  # List Stores
  Todas las tiendas de la plataforma, sin filtro de tenant — `Store` no es
  tenant-scoped, porque es el tenant. Por eso este endpoint tiene que estar
  cerrado con política: sin ella devolvería el padrón completo a cualquiera.

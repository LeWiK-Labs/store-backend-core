info:
  name: My Order (detail)
  type: http
  seq: 5
http:
  method: GET
  url: "{{baseUrl}}/account/orders/{{myOrderId}}"
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
settings:
  encodeUrl: true
docs: |-
  # My Order (detail)
  El detalle de un pedido propio: total, pagado, saldo y líneas. Es la misma vista
  que `/pay/{token}` porque es la misma necesidad — un comprador mirando su compra,
  sin customerId ni referencias de pasarela.

  La consulta filtra por id **y** por el cliente de la sesión, así que pedir el
  pedido de otro da **404** y no 403: un 403 confirmaría que ese pedido existe.

  Probalo pegando el `myOrderId` de otra cuenta.

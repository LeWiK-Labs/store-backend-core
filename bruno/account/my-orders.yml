info:
  name: My Orders
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/account/orders"
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        if (res.status === 200 && res.body.length > 0) { bru.setEnvVar("myOrderId", res.body[0].id); }
settings:
  encodeUrl: true
docs: |-
  # My Orders
  Los pedidos del comprador de la sesión, del más nuevo al más viejo. Guarda el
  primero en `myOrderId`.

  El id del cliente sale de los claims de la sesión, **nunca** del request: en el
  momento en que se pudiera mandar, "mis pedidos" pasaría a ser "los de cualquiera".

  Acá se ve el beneficio del modelo unificado: si el email se registró después de
  haber comprado como invitado, esas compras están en esta lista.

  ## Respuestas
  - **200** — `[{ id, createdAt, fulfillmentStatus, paymentStatus, currency, total, paid, balance, lineCount }]`
  - **401** — sin sesión de comprador (una cookie de staff tampoco sirve)
  - **403** — sesión de comprador de OTRA tienda

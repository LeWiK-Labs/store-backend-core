info:
  name: Login
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/auth/customer/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{customerEmail}}",
        "password": "{{customerPassword}}"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
settings:
  encodeUrl: true
docs: |-
  # Login
  Abre sesión de comprador en la tienda activa. Dura 30 días: no es un turno de
  caja, es alguien que vuelve a la tienda.

  ## Respuestas
  - **200** — `{ name, email, expiresAt }` + cookie
  - **400** `auth.invalid_credentials` — **el mismo error** exista o no la cuenta, y
    también si ese email compró como invitado y por lo tanto no tiene contraseña.
    Se gasta el mismo tiempo de PBKDF2 en los tres casos, porque si no el reloj
    filtraría lo que el mensaje esconde: la lista de clientes de la tienda.
  - **403** `platform.store_suspended` — la tienda está suspendida. Desde 4.7 esto
    llega **antes** que el handler: la tienda está cerrada al comprador. El staff sí
    puede entrar (`/auth/staff/*`), porque son los que pueden hacer algo al respecto.
    Hasta 4.7 la excepción era el prefijo `/auth` pelado y el login de clientes
    seguía abierto en una tienda que contestaba 403 a todo lo demás.

name: local-tenant-a
variables:
  - name: baseUrl
    value: http://localhost:5223
    enabled: true
  # Desde 4.3 el tenant tiene que ser una TIENDA real (staff_users tiene FK a
  # stores), así que el GUID inventado que había acá ya no sirve. Corré
  # Platform > Create Store: su test deja el id acá solo.
  - name: tenantId
    value: ""
    enabled: true
  # El subdominio de la tienda: lo llena Create Store y lo usa Health > Tenant by
  # Domain, que resuelve como en producción en vez de por el header.
  - name: storeSlug
    value: cardshop
    enabled: true
  - name: staffEmail
    value: dueno@cardshop.cl
    enabled: true
  - name: staffPassword
    value: password-larga-123
    enabled: true
  - name: operatorEmail
    value: admin@lewik.cl
    enabled: true
  - name: operatorPassword
    value: cambiar-esto-ya-1234
    enabled: true
  # El comprador. Para ver la promoción de invitado a registrado, corré primero
  # Orders > Checkout con este mismo email y después Account > Register.
  - name: customerEmail
    value: cliente@test.cl
    enabled: true
  - name: customerPassword
    value: micontrasena123
    enabled: true

http:
  method: GET
  url: "{{baseUrl}}/admin/orders/{{orderId}}"
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
settings:
  encodeUrl: true
docs: |-
  # Get Order
  Devuelve el pedido: estados (fulfillment + pago), total/pagado/saldo/abono, y líneas.

  `reservationExpiresAt` (4.6) es el plazo de la reserva blanda: hasta cuándo este pedido
  retiene su stock (o su cupo de preventa) sin haber pagado nada. Queda en `null` en cuanto
  entra plata —cualquier monto apaga el reloj para siempre— y cuando el pedido se cancela.
  Iniciar un pago lo corre hacia adelante para que la pasarela no quede a medias.

  ## Respuestas
  - **200** — el pedido
  - **404** `order.not_found`
info:
  name: Guest view (payment link)
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/pay/{{accessToken}}"
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
settings:
  encodeUrl: true
docs: |-
  # Guest view
  Lo que ve el comprador con el token que le devolvió el checkout. **Sin sesión y
  sin header de tenant**: el backend resuelve la tienda desde el token.

  Existe porque `GET /admin/orders/{id}` dejó de ser público en 4.3 — antes un
  GUID adivinado o filtrado entregaba nombre, email y teléfono de un desconocido.

  La respuesta es a propósito más flaca que la del panel: total, pagado, saldo y
  líneas. Sin customerId, sin estado de fulfillment, sin referencias de pasarela.

  Sí lleva `reservationExpiresAt` (4.6): quien corre contra ese reloj es justamente quien tiene
  este link. Es su propio pedido, así que no revela nada que no sepa, y sin el plazo su primera
  noticia de la ventana sería un pago rechazado sobre un pedido ya cancelado.

  Para pagar el saldo: `POST /pay/{token}/initiate` con `{"gateway":"Transfer"}`.

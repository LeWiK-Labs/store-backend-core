info: { name: Auth, type: folder, seq: 0 }
docs: |-
  Login de las dos poblaciones. Corré uno de estos ANTES que nada: desde 4.3 todo
  lo que vive bajo `/admin` y `/platform` exige sesión, y Bruno guarda la cookie
  automáticamente por dominio.

  - **Staff login** → habilita todo `/admin/*` de la tienda del environment activo.
  - **Platform login** → habilita `/platform/*` (crear y listar tiendas).

  El token nunca vuelve en el body: viaja en una cookie HttpOnly, host-only.
